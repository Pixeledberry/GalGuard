name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "GalGuardAndroid/**"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: GalGuardAndroid
        run: gradle assembleDebug --no-daemon
      - name: Name the APK after the app version
        id: ver
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' GalGuardAndroid/app/build.gradle.kts)
          cp GalGuardAndroid/app/build/outputs/apk/debug/app-debug.apk "GalGuard-v${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: GalGuard-android-apk
          path: GalGuard-v${{ steps.ver.outputs.version }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: GalGuard v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Builds of GalGuard v${{ steps.ver.outputs.version }}.

            - **Android:** download the .apk and open it on your phone (allow "Install unknown apps" when asked).
            - **Apple:** the .ipa is not signed, so it needs a sideloading tool such as AltStore or Sideloadly. If you can't use one, use the web app.
          files: GalGuard-v${{ steps.ver.outputs.version }}.apk
