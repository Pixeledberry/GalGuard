name: Build iOS app (unsigned)
on:
  workflow_dispatch:
  push:
    paths:
      - "GalGuardiOS/**"
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: GalGuardiOS
        run: xcodegen generate
      - name: Build (no code signing)
        working-directory: GalGuardiOS
        run: |
          xcodebuild -project GalGuard.xcodeproj -scheme GalGuard -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        id: pack
        run: |
          VERSION=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)".*/\1/p' GalGuardiOS/project.yml)
          cd GalGuardiOS
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GalGuard.app Payload/
          zip -qr "../GalGuard-v${VERSION}-unsigned.ipa" Payload
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: GalGuard-ios-ipa
          path: GalGuard-v${{ steps.pack.outputs.version }}-unsigned.ipa
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pack.outputs.version }}
          name: GalGuard v${{ steps.pack.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Builds of GalGuard v${{ steps.pack.outputs.version }}.

            - **Android:** download the .apk and open it on your phone (allow "Install unknown apps" when asked).
            - **Apple:** the .ipa is not signed, so it needs a sideloading tool such as AltStore or Sideloadly. If you can't use one, use the web app.
          files: GalGuard-v${{ steps.pack.outputs.version }}-unsigned.ipa
