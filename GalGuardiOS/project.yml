name: GalGuard
options:
  bundleIdPrefix: com.galguard
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.3"
    CURRENT_PROJECT_VERSION: "24"
targets:
  GalGuard:
    type: application
    platform: iOS
    sources:
      - GalGuard
    info:
      path: GalGuard/Info.plist
      properties:
        CFBundleDisplayName: GalGuard
        NSCameraUsageDescription: GalGuard uses the camera to scan product barcodes, QR codes and ingredient lists, and to take recipe photos.
        NSPhotoLibraryUsageDescription: GalGuard lets you pick a photo from your library for your own recipes.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.galguard.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
